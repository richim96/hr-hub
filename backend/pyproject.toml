[project]
name = "hr-hub-backend"
version = "0.1.0"
description = "A centralized hub for AI-augmented HR workflows."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.18.4",
    "chromadb>=1.5.5",
    "fastapi[standard]>=0.128.2",
    "guidance>=0.3.1",
    "pandas>=3.0.2",
    "pydantic>=2.12.5",
    "pydantic-ai>=1.56.0",
    "python-dotenv>=1.2.1",
    "scikit-learn>=1.8.0",
    "sqlalchemy>=2.0.49",
]

[dependency-groups]
dev = [
    "mypy>=1.19.1",
    "pytest>=9.0.2",
    "ruff>=0.15.0",
]

